name: Update Spot Forecast Archive

on:
  workflow_dispatch:
    inputs:
      archive_completed_utc:
        description: "UTC completion time of the spot forecast archive"
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: update-spot-archive
  cancel-in-progress: false

jobs:
  update-archive:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Generate forecast index
        run: python scripts/build_index.py

      - name: Save archive completion timestamp
        env:
          ARCHIVE_COMPLETED_UTC: ${{ inputs.archive_completed_utc }}
        run: |
          python - <<'PY'
          import json
          import os
          from datetime import datetime, timezone
          from pathlib import Path

          timestamp = os.environ.get("ARCHIVE_COMPLETED_UTC", "").strip()
          output = Path("data/archive-status.json")

          if timestamp:
              completed = datetime.fromisoformat(
                  timestamp.replace("Z", "+00:00")
              )

              if completed.tzinfo is None:
                  raise ValueError("Archive timestamp must include a timezone.")

              status = {
                  "last_updated_utc": completed.astimezone(
                      timezone.utc
                  ).isoformat(timespec="seconds").replace("+00:00", "Z")
              }

              output.parent.mkdir(parents=True, exist_ok=True)
              output.write_text(
                  json.dumps(status, indent=2) + "\n",
                  encoding="utf-8"
              )

              print(f"Saved archive completion time: {timestamp}")
          else:
              print("No archive timestamp supplied; preserving existing status.")
          PY

      - name: Commit updated index
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/forecasts.json
          git add -f data/archive-status.json 2>/dev/null || true

          if git diff --cached --quiet; then
            echo "No archive changes to commit."
          else
            git commit -m "Update spot forecast archive index"
            git push
          fi
