
name: Update Spot Forecast Archive

on:
  schedule:
    # Run daily at 00:15 UTC
    - cron: "15 0 * * *"

  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-spot-archive
  cancel-in-progress: false

jobs:
  update-archive:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate forecast index
        run: python scripts/build_index.py

      - name: Commit updated index
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/forecasts.json

          if git diff --cached --quiet; then
            echo "No archive changes to commit."
          else
            git commit -m "Update spot forecast archive index"
            git push
          fi
